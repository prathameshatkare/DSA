  <body>
    <div class="flipkart_page">
      <div class="p_nav">
        <div class="navbar">
          <div class="f_logo"></div>
          <div class="m_logo"></div>
          <div class="t_logo"></div>

        <div class="left_nav">

        </div>

          <div>Appliance</div>
        </div>

        </div>

        <div class="s_logo">

        </div>

      <!-- Your additional div is now inside flipkart_page -->
      <div class="add">
        <div>
          <img src="./images/Flip1.webp" alt="" class="flip1" />

        <div>
